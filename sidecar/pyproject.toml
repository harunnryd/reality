[project]
name = "reality-sidecar"
version = "0.1.0"
description = "Reality AI sidecar — LangGraph/LangChain orchestration over stdio JSON-RPC"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "sqlite-vec>=0.1",
]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
